name: vail_chat
description: "Vail — blind chat and blind dates."
publish_to: "none"

version: 1.0.4+5

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.6.3
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  firebase_core: ^3.14.0
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.0
  firebase_database: ^11.3.0
  firebase_messaging: ^15.1.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
